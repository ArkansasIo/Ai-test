<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI-Test Platform Safety and Architecture</title>
<desc id="desc">A dark command-center safety diagram showing authentication, sandbox, audit, model routing, and a safe execution flow.</desc>
<rect width="1600" height="900" fill="#0b1020"/>
<rect x="60" y="60" width="1480" height="780" rx="32" fill="#111a2e" stroke="#33466d" stroke-width="3"/>
<text x="110" y="125" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="42" font-weight="700">AI-Test Platform • Safety &amp; Architecture</text>
<text x="110" y="175" fill="#9fb2d7" font-family="system-ui,sans-serif" font-size="24">Phone-first modular AI operating platform</text>
<g font-family="system-ui,sans-serif">
<rect x="110" y="240" width="650" height="115" rx="18" fill="#17233b" stroke="#2c4168" stroke-width="2"/>
<text x="135" y="282" fill="#7ee787" font-size="25" font-weight="700">AUTH &amp; RBAC</text><text x="135" y="326" fill="#c9d5eb" font-size="21">Identity • roles • approvals</text>
<rect x="840" y="240" width="650" height="115" rx="18" fill="#17233b" stroke="#2c4168" stroke-width="2"/>
<text x="865" y="282" fill="#7ee787" font-size="25" font-weight="700">SANDBOX</text><text x="865" y="326" fill="#c9d5eb" font-size="21">Isolated tools • code execution</text>
<rect x="110" y="390" width="650" height="115" rx="18" fill="#17233b" stroke="#2c4168" stroke-width="2"/>
<text x="135" y="432" fill="#7ee787" font-size="25" font-weight="700">AUDIT</text><text x="135" y="476" fill="#c9d5eb" font-size="21">Events • traceability • logs</text>
<rect x="840" y="390" width="650" height="115" rx="18" fill="#17233b" stroke="#2c4168" stroke-width="2"/>
<text x="865" y="432" fill="#7ee787" font-size="25" font-weight="700">MODEL ROUTER</text><text x="865" y="476" fill="#c9d5eb" font-size="21">Local • open • API providers</text>
<rect x="110" y="555" width="1380" height="190" rx="22" fill="#0e1628" stroke="#2c4168" stroke-width="2"/>
<text x="145" y="605" fill="#e8eefc" font-size="25" font-weight="700">Safe execution flow</text>
<text x="145" y="660" fill="#a9d1ff" font-family="monospace" font-size="24">USER → AUTH → APPROVAL → TOOL/SANDBOX → AUDIT → RESULT</text>
<text x="145" y="708" fill="#9fb2d7" font-size="20">No photos/asset folder • documentation is kept under docs/</text>
</g>
</svg>
